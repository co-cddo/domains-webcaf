[project]
name = "webcaf"
version = "0.1.0"
description = "GOVUK webcaf"
authors = [
    { name = "Cyber and domain protection team" }
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "django>=5.1.13,<5.2",
    "whitenoise>=6.9.0,<7",
    "django-environ>=0.12.0,<0.13",
    "python-dotenv>=1.1.0,<2",
    "django-csp>=4.0,<5",
    "govuk-frontend-django==0.15.1",
    "psycopg[binary]>=3.2.9,<4",
    "pyyaml>=6.0.2,<7",
    "mozilla-django-oidc>=4.0.1,<5",
    "django-multiselectfield>=1.0.1,<2",
    "openpyxl>=3.1.5,<4",
    "django-simple-history>=3.10.1,<4",
    "django-axes>=8.0.0,<9",
    "weasyprint>=70.0,<71",
    "sentry-sdk[django]>=2.8.0,<3",
    "django-otp==1.6.1",
    "notifications-python-client==10.0.1",
    "fonttools>=4,<5",
    "pypdf>=6.21.4,<7",
    "charset-normalizer>=3.4.5,<4",
    "boto3>=1.42.73,<2",
    "boto3-stubs>=1.42.73,<2",
    "python-slugify>=8.0.4,<9",
    # Was `pip install gunicorn` in the Dockerfile, unpinned; uv.lock now records the version.
    "gunicorn",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0,<5",
    # ruff replaces isort, flake8 and black
    "ruff>=0.17.2,<0.18",
    "ipdb>=0.13.13,<0.14",
    "web-pdb>=1.6.2,<2",
    "parameterized>=0.9.0,<0.10",
    "types-markdown>=3.6.0.20240316,<4",
    "mypy>=1.15.0,<2",
    "django-stubs[compatible-mypy]>=5.1.3,<6",
    "types-pyyaml>=6.0.12,<7",
]
test = [
    "playwright>=1.55.0,<2",
    "pytest-playwright>=0.7.0,<0.8",
    "behave>=1.2.6,<2",
    "ruamel-yaml>=0.18.15,<0.19",
    "behave-html-formatter>=0.9.10,<0.10",
    "freezegun>=1.5.5,<2",
    "pytest>=9.1.1,<10",
    "pytest-django>=4.14.0,<5",
    "pytest-html>=4.2.0,<5",
]

[tool.uv]
package = false
# Versions with known vulnerabilities, excluded from resolution
constraint-dependencies = [
    "litellm!=1.82.7,!=1.82.8",
    "certifi!=2024.2.2",
]

[tool.ruff]
# https://gds-way.cloudapps.digital/manuals/programming-languages/python/python.html#maximum-line-length-of-120-characters
line-length = 120
target-version = "py312"
extend-exclude = ["webcaf/static", "webcaf/seed", "seed", "cache", "wsgi.py", "asgi.py"]

[tool.ruff.lint]
# E/W/F replace flake8, I replaces isort, C90 keeps the flake8 max-complexity check.
select = ["E", "F", "W", "I", "C90"]
# E203 whitespace before ':' in slice
# E501 line too long; about 111 files have docstrings - out of scope for this task
ignore = ["E203", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.mypy]
ignore_missing_imports = true
mypy_path = "."
pretty = true
# The pre-commit hook runs `mypy .`, so path excludes live here, not in the hook.
exclude = ['wsgi\.py$']
plugins = ['mypy_django_plugin.main']

[tool.django-stubs]
django_settings_module = "webcaf.settings"
