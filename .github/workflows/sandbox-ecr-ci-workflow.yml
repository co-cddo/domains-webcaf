name: Build & Publish Docker to ECR (Sandbox)

#Run this workflow when a feature branch is merged into main. Image is deployed to Sandbox environment.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

concurrency:
    group: sandbox
    cancel-in-progress: false

jobs:
  build-and-push:
    name: CI - Build and push to ECR
    runs-on: ubuntu-latest
    environment:
      name: Sandbox
    outputs:
      image-uri: ${{ steps.push-image.outputs.image-uri }}

    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # Figure out the image name based on the tag
      - name: Derive image name
        id: image_name
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE_IMAGE="webcaf-sandbox"
          echo "Image name is : $BASE_IMAGE"
          echo "IMAGE_NAME=$BASE_IMAGE" >> $GITHUB_OUTPUT
      - name: Debug GitHub Context
        run: |
          echo "Repository=${{ github.repository }}"
          echo "Ref=${{ github.ref }}"
          echo "RefName=${{ github.ref_name }}"
          echo "Workflow=${{ github.workflow }}"

      - name: Configure AWS credentials (Sandbox)
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838
        with:
          role-to-assume: ${{ vars.SANDBOX_GITHUB_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Ensure packages are pushed only from main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "❌ Not running on main branch (current ref: ${GITHUB_REF})"
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build, Tag, and Push Docker image
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          IMAGE_NAME: ${{ steps.image_name.outputs.IMAGE_NAME }}
          GOV_UK_ONE_LOGIN_PRIVATE_KEY: ${{ secrets.GOV_UK_ONE_LOGIN_PRIVATE_KEY }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}   # short commit SHA as the tag
          echo "Pushing image: $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker buildx build --platform linux/amd64 \
          --build-arg GOV_UK_ONE_LOGIN_PRIVATE_KEY="$GOV_UK_ONE_LOGIN_PRIVATE_KEY" \
          -t $ECR_REGISTRY/caf/$IMAGE_NAME:$IMAGE_TAG \
          . --push;
          # Output the image URI for the CD job
          echo "image-uri=$ECR_REGISTRY/caf/$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
      name: CD - Deploy to ECS
      runs-on: ubuntu-latest
      needs: build-and-push
      environment:
        name: Sandbox

      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Sandbox)
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ vars.SANDBOX_GITHUB_ROLE_ARN }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition default-webcaf-sandbox \
            --query taskDefinition > task-def.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: Main
          image: ${{ needs.build-and-push.outputs.image-uri }}
          # Pass environment variables
          environment-variables: |
            DEBUG=${{ vars.DEBUG }}
            ENVIRONMENT=${{ vars.ENVIRONMENT }}
            GOV_UK_ONE_LOGIN_ENVIRONMENT=${{ vars.GOV_UK_ONE_LOGIN_ENVIRONMENT }}
            GOV_UK_ONE_LOGIN_OPENID_CONFIG_URL=${{ vars.GOV_UK_ONE_LOGIN_OPENID_CONFIG_URL }}
            GOV_UK_ONE_LOGIN_PRIVATE_KEY_PATH=${{ vars.GOV_UK_ONE_LOGIN_PRIVATE_KEY_PATH }}
            GOV_UK_ONE_LOGIN_SCOPE=${{ vars.GOV_UK_ONE_LOGIN_SCOPE }}
            SSO_MODE=${{ vars.SSO_MODE }}
            NOTIFY_TEST_TEMPLATE_ID=${{ vars.NOTIFY_TEST_TEMPLATE_ID }}
            NOTIFY_API_KEY=${{ secrets.NOTIFY_API_KEY }}
            GOV_UK_ONE_LOGIN_CLIENT_ID=${{ secrets.GOV_UK_ONE_LOGIN_CLIENT_ID }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_HOST=${{ secrets.DATABASE_URL }}
            INTERNAL_ACCESS_SECRET_ARN=${{ vars.INTERNAL_ACCESS_SECRET_ARN }}
            INTERNAL_ACCESS_CLIENT_ID=${{ vars.INTERNAL_ACCESS_CLIENT_ID }}
            INTERNAL_ACCESS_AUTHORIZATION_ENDPOINT=${{ vars.INTERNAL_ACCESS_AUTHORIZATION_ENDPOINT }}
            INTERNAL_ACCESS_TOKEN_ENDPOINT=${{ vars.INTERNAL_ACCESS_TOKEN_ENDPOINT }}
            INTERNAL_ACCESS_USERINFO_ENDPOINT=${{ vars.INTERNAL_ACCESS_USERINFO_ENDPOINT }}
            INTERNAL_ACCESS_JWKS_ENDPOINT=${{ vars.INTERNAL_ACCESS_JWKS_ENDPOINT }}
            INTERNAL_ACCESS_LOGOUT_ENDPOINT=${{ vars.INTERNAL_ACCESS_LOGOUT_ENDPOINT }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: webcaf-sandbox
          cluster: default
          wait-for-service-stability: true

      - name: Clean up local copy of task definition
        run: |
          rm -f task-def.json
