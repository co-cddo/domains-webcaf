name: CI

on:
  push:
    branches: [ feature/refactor-dsv ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Install dependencies and run linters
        run: |
          uv sync --frozen --all-groups
          uv run pre-commit run --all-files

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Run unit tests
        env:
          ENVIRONMENT: local
        run: |
          mkdir -p reports
          chmod o+w reports
          make test

  feature-tests:
    name: Feature tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run feature tests
        run: |
          mkdir -p artifacts
          make behave

      - name: Save Docker logs
        if: failure()
        run: docker compose logs --no-color > artifacts/docker-compose.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-logs
          path: artifacts

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.feature-tests.yml down -v
