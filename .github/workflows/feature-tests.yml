name: Feature tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  feature-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build and run GOV.UK One Login feature tests
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          BUILDX_CACHE_FROM: type=gha
          BUILDX_CACHE_TO: type=gha,mode=max
        run: |
          mkdir -p artifacts
          make behave

      - name: Upload Allure test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          if-no-files-found: warn
          path: |
            artifacts
            reports

      - name: Teardown
        if: always()
        run: make behave-clean

  dex-feature-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build and run focused DEX feature tests
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          BUILDX_CACHE_FROM: type=gha
          BUILDX_CACHE_TO: type=gha,mode=max
        run: |
          mkdir -p artifacts
          make behave_dex

      - name: Upload Allure test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-allure-report
          if-no-files-found: warn
          path: |
            artifacts
            reports

      - name: Teardown
        if: always()
        run: make behave-clean
