default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        exclude: webcaf/static|seed/
      - id: trailing-whitespace
        exclude: webcaf/static|seed/

  # Runs the ruff pinned in uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

  # Keep uv.lock in sync with pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
        files: ^(pyproject\.toml|uv\.lock)$

  # https://gds-way.cloudapps.digital/standards/pre-commit-hooks.html
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (^\.github/workflows/)|package\.lock\.json|(^tests/fixtures/)|webcaf/static|seed/|uv\.lock

  # Static type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: env DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib SSO_MODE=none DEBUG=True uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

  # actionlint: GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # shellcheck: shell script linting (workflow run blocks)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
